<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marcador de Baloncesto</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
body {
    background-color: #121212;
    color: white;
    font-family: 'Orbitron', sans-serif;
    text-align: center;
    margin: 0;
    overflow: hidden;
    height: 100vh;
    user-select: none;
}

.scoreboard {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    height: 100vh;
    width: 100vw;
    padding: 4vh 3vw;
    box-sizing: border-box;
}

.timer-container {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 20vh;
}

#timer {
    font-size: 20vw;
    font-weight: bold;
    color: #ffcc00;
    text-shadow: 0.5vw 0.5vw 1.5vw rgba(255, 204, 0, 0.7);
    margin: 0;
    padding: 0;
    line-height: 1;
}

.quarter-container {
    margin-top: 1vh;
    margin-bottom: 1vh;
}

#quarter {
    font-size: 8vw;
    font-weight: bold;
    color: #fff;
    text-shadow: 0.3vw 0.3vw 0.8vw rgba(255, 255, 255, 0.7);
    cursor: pointer;
}

.fouls-container {
    position: fixed;
    top: 1vh;
    left: 2vw;
    right: 2vw;
    display: flex;
    justify-content: space-between;
    z-index: 1000;
}

.foul {
    font-size: 10vw;
    color: white;
    font-weight: bold;
    width: 10vw;
    text-align: center;
}

.tiempos-container {
    position: fixed;
    top: 20vh;
    left: 2vw;
    right: 2vw;
    display: flex;
    justify-content: space-between;
    z-index: 1000;
}

.tiempos {
    font-size: 5vw;
    color: yellow;
    cursor: pointer;
    text-align: center;
    width: 10vw;
}

.teams-container {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 90vw;
    padding: 0 5vw;
    margin-top: -2vh;
}

.team {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1;
    text-align: center;
    margin-bottom: 2vh;
}

.team h2 {
    font-size: clamp(2.5vw, 4vw, 6vw);
    margin-bottom: 1vh;
    word-wrap: break-word;
    max-width: 90%;
}

.score-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1vw;
    max-width: 35vw;
}

.score {
    font-size: 12vw;
    min-width: 8vw;
    text-align: center;
    transition: font-size 0.2s;
}

.score-buttons {
    display: flex;
    flex-direction: column;
    gap: 0.5vw;
}

/* ==== BOTONES + Y - PLANOS ==== */
.score-button {
    background: none;
    border: none;
    color: white;
    font-size: 6vw;
    cursor: pointer;
    padding: 0;
    outline: none;
}

.score-button:hover,
.score-button:active,
.score-button:focus {
    color: white;
    transform: none;
}
/* ================================= */

.center-image {
    width: 25vw;
    height: auto;
    margin-top: -2vh;
    cursor: pointer;
}

.settings-button {
    position: fixed;
    top: 50%;
    right: 2vw;
    transform: translateY(-50%);
    cursor: pointer;
    font-size: 3.5vw;
    color: white;
    z-index: 1001;
}

.settings-modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.9);
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

.settings-content {
    background: #222;
    padding: 2.5vh 4vw;
    border-radius: 2vw;
    text-align: center;
    width: 35vw;
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    max-height: 80vh;
    overflow-y: auto;
}

.close-btn {
    font-size: 2.5vw;
    color: white;
    position: absolute;
    top: 1vh;
    right: 1vw;
    cursor: pointer;
}

h3 { font-size: 2.5vw; margin-bottom: 2vh; color: #ffcc00; }

label { font-size: 2vw; margin: 1vh 0; display: block; }

input[type="text"], input[type="number"] {
    font-size: 2vw;
    padding: 0.4vw;
    margin-top: 0.4vh;
    width: 5vw;
    border: 1px solid #ffcc00;
    background: #333;
    color: white;
    border-radius: 0.5vw;
}

button#save-settings, button#set-1-minute, button#set-5-minutes, button#set-10-minutes, button#set-20-minutes {
    font-size: 2vw;
    padding: 0.8vh 1.5vw;
    background: #ffcc00;
    color: black;
    border: none;
    border-radius: 1vw;
    cursor: pointer;
    margin-top: 1.5vh;
}

button#save-settings:hover, button#set-1-minute:hover, button#set-5-minutes:hover,
button#set-10-minutes:hover, button#set-20-minutes:hover { background: #ff9900; }

.fullscreen-button {
    position: fixed;
    bottom: 2vh;
    right: 2vw;
    background: none;
    color: white;
    font-size: 3.5vw;
    padding: 1vw;
    cursor: pointer;
    border-radius: 1vw;
    z-index: 1001;
    border: none;
}

.buzzer-button {
    position: fixed;
    bottom: 2vh;
    left: 2vw;
    background: none;
    width: 4.5vw;
    height: 4.5vw;
    cursor: pointer;
    z-index: 1001;
    border: none;
    padding: 0;
}

.buzzer-icon { width: 100%; height: 100%; fill: none; stroke: white; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ===================== */
/* Quitar borde azul y resaltado táctil en todos los elementos */
*:focus {
    outline: none !important;
    box-shadow: none !important;
}

button, input, textarea, div, img {
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}
/* ===================== */

@media (max-width: 600px) {
    #timer { font-size: 35vw; }
    #quarter { font-size: 15vw; }
    .team h2 { font-size: clamp(5vw, 6vw, 8vw); }
    .score { font-size: 18vw; }
    .score-button { font-size: 10vw; }
    .center-image { width: 40vw; }
    .settings-button { font-size: 9vw; }
    .settings-content { width: 65vw; }
    .buzzer-button { width: 10vw; height: 10vw; }
    .foul { font-size: 15vw; }
    .tiempos { font-size: 7vw; }
}
</style>
</head>
<body>
<div class="scoreboard">
    <div class="settings-button">&#9881;</div>
    <div class="timer-container"><div id="timer">10:00</div></div>
    <div class="quarter-container"><div id="quarter">1º Cuarto</div></div>
    <div class="fouls-container">
        <div class="foul" id="local-fouls">0</div>
        <div class="foul" id="visitor-fouls">0</div>
    </div>
    <div class="tiempos-container">
        <div class="tiempos" id="tiempos-local">○○○</div>
        <div class="tiempos" id="tiempos-visitante">○○○</div>
    </div>
    <div class="teams-container">
        <div class="team" id="local-team">
            <h2>Yuncos</h2>
            <div class="score-container">
                <span class="score" id="local-score">0</span>
                <div class="score-buttons">
                    <button class="score-button" id="local-plus"><i class="fas fa-plus"></i></button>
                    <button class="score-button" id="local-minus"><i class="fas fa-minus"></i></button>
                </div>
            </div>
        </div>
        <img class="center-image" src="Adobe Express - file.png" alt="Imagen central" id="timer-control">
        <div class="team" id="visitor-team">
            <h2>Visitante</h2>
            <div class="score-container">
                <span class="score" id="visitor-score">0</span>
                <div class="score-buttons">
                    <button class="score-button" id="visitor-plus"><i class="fas fa-plus"></i></button>
                    <button class="score-button" id="visitor-minus"><i class="fas fa-minus"></i></button>
                </div>
            </div>
        </div>
    </div>
    <button class="fullscreen-button" id="fullscreen-btn">&#x26F6;</button>
    <button class="buzzer-button" id="play-buzzer-btn">
        <svg class="buzzer-icon" viewBox="0 0 24 24">
            <path d="M18 5h-4V3h-4v2H6l-2 4h16l-2-4z"/>
            <path d="M8 9h8v6H8z"/>
            <circle cx="12" cy="12" r="2"/>
        </svg>
    </button>
</div>

<div class="settings-modal">
    <div class="settings-content">
        <span class="close-btn">&times;</span>
        <h3>Configuración</h3>
        <label> Minutos: <input type="number" id="minutes" min="0" max="99" value="10"></label>
        <label>Segundos: <input type="number" id="seconds" min="0" max="59" value="0"></label>
        <label>Décimas: <input type="number" id="decimals" min="0" max="9" value="0"></label>
        <label>Nombre del equipo local: <input type="text" id="local-team-name" value="Yuncos"></label>
        <label>Nombre del equipo visitante: <input type="text" id="visitor-team-name" value="Visitante"></label>
        <button id="set-1-minute">1 Minuto</button>
        <button id="set-5-minutes">5 Minutos</button>
        <button id="set-10-minutes">10 Minutos</button>
        <button id="set-20-minutes">20 Minutos</button>
        <button id="save-settings">Guardar</button>
    </div>
</div>

<audio id="buzzer" src="buzzer.mp3" preload="auto"></audio>

<script>
let minutes = 10, seconds = 0, decimals = 0;
let timerRunning = false, timerInterval;
let localScore = 0, visitorScore = 0;
let localFouls = 0, visitorFouls = 0;
let tiemposLocal = 0, tiemposVisitante = 0;
let quarter = 1;

const localFoulsElemento = document.getElementById('local-fouls');
const visitorFoulsElemento = document.getElementById('visitor-fouls');
const tiemposLocalElemento = document.getElementById('tiempos-local');
const tiemposVisitanteElemento = document.getElementById('tiempos-visitante');

function updateScores(){
    document.getElementById('local-score').textContent = localScore;
    document.getElementById('visitor-score').textContent = visitorScore;
}

function updateFouls(){
    localFoulsElemento.textContent = localFouls;
    visitorFoulsElemento.textContent = visitorFouls;
    // Mantiene la lógica de color original del CSS
    localFoulsElemento.style.color = localFouls===4 ? 'yellow' : localFouls===5 ? 'red' : 'white';
    visitorFoulsElemento.style.color = visitorFouls===4 ? 'yellow' : visitorFouls===5 ? 'red' : 'white';
}

function actualizarTiempos(){
    tiemposLocalElemento.textContent='●'.repeat(tiemposLocal)+'○'.repeat(3-tiemposLocal);
    tiemposVisitanteElemento.textContent='●'.repeat(tiemposVisitante)+'○'.repeat(3-tiemposVisitante);
}

function manejarTiempos(equipo){
    if(equipo==='local') tiemposLocal=tiemposLocal<3? tiemposLocal+1 :0;
    else tiemposVisitante=tiemposVisitante<3? tiemposVisitante+1:0;
    actualizarTiempos();
}

function updateTimer(){
    let displaySeconds = seconds < 10 && minutes === 0 ? `${seconds}` : seconds < 10 ? `0${seconds}` : seconds;
    let displayTime = minutes > 0 ? `${minutes}:${displaySeconds}` : `${displaySeconds}.${decimals}`;
    document.getElementById('timer').textContent = displayTime;
}

function runTimer(){
    if(!timerRunning) return;
    if(minutes===0 && seconds===0 && decimals===0){
        clearInterval(timerInterval); timerRunning=false; updateTimer(); playBuzzer();
    } else{
        decimals--;
        if(decimals<0){
            decimals=9; seconds--;
            if(seconds<0 && minutes>0){
                seconds=59; minutes--;
            } else if(seconds<0 && minutes===0){
                seconds=0; decimals=0;
            }
        }
        updateTimer();
    }
}

// ** FUNCIÓN CORREGIDA PARA EL TIMBRE (Detiene el bucle silencioso) **
function playBuzzer(){
    const buzzer=document.getElementById('buzzer'); 
    
    // 1. Detenemos el bucle silencioso
    buzzer.pause(); 
    buzzer.currentTime = 0; 

    // 2. Subimos el volumen y reproducimos el timbre
    buzzer.volume = 1.0; 
    buzzer.loop = false;
    
    buzzer.play().catch(e=>console.log("Error al intentar reproducir el timbre:", e));
    
    // 3. Cuando termina de sonar, reiniciamos el bucle silencioso
    buzzer.onended = () => {
        restartSilentStream(); 
        buzzer.onended = null;
    };
}

// ** FUNCIÓN QUE INICIA EL STREAM SILENCIOSO CONSTANTE (VOLUMEN 0.0001) **
function initializeContinuousAudio() {
    const buzzer = document.getElementById('buzzer');
    
    buzzer.loop = true;
    
    // Volumen ajustado a 0.0001 (ultrasilencioso)
    buzzer.volume = 0.0001; 
    
    buzzer.play()
        .then(() => {})
        .catch(error => {
            // Si falla el autoplay, restauramos el volumen normal en caso de que el usuario tenga que tocar el botón
            buzzer.volume = 1.0; 
        });
}

// ** FUNCIÓN PARA REINICIAR EL STREAM SILENCIOSO (VOLUMEN 0.0001) **
function restartSilentStream() {
    const buzzer = document.getElementById('buzzer');
    
    buzzer.loop = true;
    buzzer.volume = 0.0001; // Volumen ajustado
    buzzer.currentTime = 0;
    buzzer.play().catch(e => {}); 
}

// Escucha el evento 'touchstart' (o click) para inicializar el audio
document.addEventListener('touchstart', function initialAudioInit(e) {
    initializeContinuousAudio();
    document.removeEventListener('touchstart', initialAudioInit);
});
document.addEventListener('click', function initialAudioInitClick(e) {
    initializeContinuousAudio();
    document.removeEventListener('click', initialAudioInitClick);
});


function updateQuarter(){
    let text = "";
    if(quarter <= 4) text = quarter + "º Cuarto";
    else if(quarter === 5) text = "Prórroga";
    else text = "Final";
    document.getElementById('quarter').textContent = text;
}

// Eventos
document.getElementById('timer-control').addEventListener('click', ()=>{
    timerRunning = !timerRunning;
    if(timerRunning) timerInterval = setInterval(runTimer,100);
    else clearInterval(timerInterval);
});
document.getElementById('fullscreen-btn').addEventListener('click', ()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen());
document.getElementById('play-buzzer-btn').addEventListener('click', playBuzzer);

document.getElementById('local-plus').addEventListener('click', ()=>{localScore=(localScore+1)%200; updateScores();});
document.getElementById('visitor-plus').addEventListener('click', ()=>{visitorScore=(visitorScore+1)%200; updateScores();});
document.getElementById('local-minus').addEventListener('click', ()=>{localScore=localScore>0? localScore-1:199; updateScores();});
document.getElementById('visitor-minus').addEventListener('click', ()=>{visitorScore=visitorScore>0? visitorScore-1:199; updateScores();});

document.getElementById('local-fouls').addEventListener('click', ()=>{localFouls=localFouls<5? localFouls+1:0; updateFouls();});
document.getElementById('visitor-fouls').addEventListener('click', ()=>{visitorFouls=visitorFouls<5? visitorFouls+1:0; updateFouls();});

document.getElementById('tiempos-local').addEventListener('click', ()=> manejarTiempos('local'));
document.getElementById('tiempos-visitante').addEventListener('click', ()=> manejarTiempos('visitante'));

document.getElementById('quarter').addEventListener('click', ()=>{quarter++; if(quarter>5) quarter=1; updateQuarter();});

document.getElementById('save-settings').addEventListener('click', ()=>{
    minutes = parseInt(document.getElementById('minutes').value) || 0;
    seconds = parseInt(document.getElementById('seconds').value) || 0;
    decimals = parseInt(document.getElementById('decimals').value) || 0;
    document.getElementById('local-team').querySelector('h2').textContent = document.getElementById('local-team-name').value;
    document.getElementById('visitor-team').querySelector('h2').textContent = document.getElementById('visitor-team-name').value;
    if(timerRunning){clearInterval(timerInterval); timerRunning=false;}
    updateTimer(); closeSettingsModal();
});

document.getElementById('set-1-minute').addEventListener('click', ()=>{
    document.getElementById('minutes').value=1;
    document.getElementById('seconds').value=0;
    document.getElementById('decimals').value=0;
});

document.getElementById('set-5-minutes').addEventListener('click', ()=>{
    document.getElementById('minutes').value=5;
    document.getElementById('seconds').value=0;
    document.getElementById('decimals').value=0;
});

document.getElementById('set-10-minutes').addEventListener('click', ()=>{
    document.getElementById('minutes').value=10;
    document.getElementById('seconds').value=0;
    document.getElementById('decimals').value=0;
});

document.getElementById('set-20-minutes').addEventListener('click', ()=>{
    document.getElementById('minutes').value=20;
    document.getElementById('seconds').value=0;
    document.getElementById('decimals').value=0;
});

document.querySelector('.settings-button').addEventListener('click', ()=>document.querySelector('.settings-modal').style.display='flex');
document.querySelector('.close-btn').addEventListener('click', closeSettingsModal);
function closeSettingsModal(){document.querySelector('.settings-modal').style.display='none';}

updateScores(); updateFouls(); actualizarTiempos(); updateTimer(); updateQuarter();
</script>
</body>
</html>
