<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marcador de Baloncesto</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
body {
    background-color: #121212;
    color: white;
    font-family: 'Orbitron', sans-serif;
    text-align: center;
    margin: 0;
    overflow: hidden;
    height: 100vh;
    user-select: none;
}

.scoreboard {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    height: 100vh;
    width: 100vw;
    padding: 4vh 3vw;
    box-sizing: border-box;
}

.timer-container {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 20vh;
}

#timer {
    font-size: 20vw;
    font-weight: bold;
    color: #ffcc00;
    text-shadow: 0.5vw 0.5vw 1.5vw rgba(255, 204, 0, 0.7);
    margin: 0;
    padding: 0;
    line-height: 1;
}

.quarter-container {
    margin-top: 1vh;
    margin-bottom: 1vh;
}

#quarter {
    font-size: 8vw;
    font-weight: bold;
    color: #fff;
    text-shadow: 0.3vw 0.3vw 0.8vw rgba(255, 255, 255, 0.7);
    cursor: pointer;
}

.fouls-container {
    position: fixed;
    top: 1vh;
    left: 2vw;
    right: 2vw;
    display: flex;
    justify-content: space-between;
    z-index: 1000;
}

.foul {
    font-size: 10vw;
    color: white;
    font-weight: bold;
    width: 10vw;
    text-align: center;
}

.tiempos-container {
    position: fixed;
    top: 20vh;
    left: 2vw;
    right: 2vw;
    display: flex;
    justify-content: space-between;
    z-index: 1000;
}

.tiempos {
    font-size: 5vw;
    color: yellow;
    cursor: pointer;
    text-align: center;
    width: 10vw;
}

.teams-container {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 90vw;
    padding: 0 5vw;
    margin-top: -2vh;
}

.team {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1;
    text-align: center;
    margin-bottom: 2vh;
}

.team h2 {
    font-size: clamp(2.5vw, 4vw, 6vw);
    margin-bottom: 1vh;
    word-wrap: break-word;
    max-width: 90%;
}

.score-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1vw;
    max-width: 35vw;
}

.score {
    font-size: 12vw;
    min-width: 8vw;
    text-align: center;
    transition: font-size 0.2s;
}

.score-buttons {
    display: flex;
    flex-direction: column;
    gap: 0.5vw;
}

.score-button {
    background: none;
    border: none;
    color: white;
    font-size: 6vw;
    cursor: pointer;
    padding: 0;
    outline: none;
}

.score-button:hover,
.score-button:active,
.score-button:focus {
    color: white;
    transform: none;
}

.center-image {
    width: 25vw;
    height: auto;
    margin-top: -2vh;
    cursor: pointer;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
    pointer-events: auto;        
}

.settings-button {
    position: fixed;
    top: 50%;
    right: 2vw;
    transform: translateY(-50%);
    cursor: pointer;
    font-size: 3.5vw;
    color: white;
    z-index: 1001;
}

.settings-modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.9);
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

.settings-content {
    background: #222;
    padding: 2.5vh 4vw;
    border-radius: 2vw;
    text-align: center;
    width: 38vw;
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    max-height: 85vh;
    overflow-y: auto;
}

.close-btn {
    font-size: 2.5vw;
    color: white;
    position: absolute;
    top: 1vh;
    right: 1vw;
    cursor: pointer;
}

h3 { font-size: 2.5vw; margin-bottom: 2vh; color: #ffcc00; }
label { font-size: 1.8vw; margin: 1.2vh 0; display: block; text-align: left; }

.label-inline {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

input[type="text"], input[type="number"] {
    font-size: 1.8vw;
    padding: 0.4vw;
    border: 1px solid #ffcc00;
    background: #333;
    color: white;
    border-radius: 0.5vw;
}
input[type="number"] { width: 5vw; text-align: center; }
input[type="text"] { width: 15vw; }

input[type="checkbox"] {
    width: 2.2vw;
    height: 2.2vw;
    cursor: pointer;
    accent-color: #ffcc00;
}

button#save-settings, button#set-1-minute, button#set-5-minutes, button#set-10-minutes, button#set-20-minutes {
    font-size: 1.8vw;
    padding: 0.8vh 1.5vw;
    background: #ffcc00;
    color: black;
    border: none;
    border-radius: 1vw;
    cursor: pointer;
    margin-top: 1.5vh;
    margin-right: 0.5vw;
}

button#save-settings:hover, button#set-1-minute:hover, button#set-5-minutes:hover,
button#set-10-minutes:hover, button#set-20-minutes:hover { background: #ff9900; }

.fullscreen-button {
    position: fixed;
    bottom: 2vh;
    right: 2vw;
    background: none;
    color: white;
    font-size: 3.5vw;
    padding: 1vw;
    cursor: pointer;
    border-radius: 1vw;
    z-index: 1001;
    border: none;
}

.buzzer-button {
    position: fixed;
    bottom: 2vh;
    left: 2vw;
    background: none;
    width: 7vw;
    height: 7vw;
    cursor: pointer;
    z-index: 1001;
    border: none;
    padding: 0;
}

.buzzer-icon { 
    width: 100%; 
    height: 100%; 
    fill: none; 
    stroke: white; 
    stroke-width: 2.5; 
    stroke-linecap: round; 
    stroke-linejoin: round; 
}

*:focus {
    outline: none !important;
    box-shadow: none !important;
}

button, input, textarea, div, img {
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

@media (max-width: 600px) {
    #timer { font-size: 35vw; }
    #quarter { font-size: 15vw; }
    .team h2 { font-size: clamp(5vw, 6vw, 8vw); }
    .score { font-size: 18vw; }
    .score-button { font-size: 10vw; }
    .center-image { width: 40vw; }
    .settings-button { font-size: 9vw; }
    .settings-content { width: 75vw; }
    label { font-size: 4vw; }
    input[type="text"] { width: 30vw; font-size: 4vw; }
    input[type="number"] { width: 10vw; font-size: 4vw; }
    input[type="checkbox"] { width: 5vw; height: 5vw; }
    button#save-settings, button#set-1-minute, button#set-5-minutes, button#set-10-minutes, button#set-20-minutes { font-size: 3.5vw; }
    .buzzer-button { width: 14vw; height: 14vw; }
    .foul { font-size: 15vw; }
    .tiempos { font-size: 7vw; }
}
</style>
</head>
<body>
<div class="scoreboard">
    <div class="settings-button">&#9881;</div>
    <div class="timer-container"><div id="timer">10:00</div></div>
    <div class="quarter-container"><div id="quarter">1º Cuarto</div></div>
    <div class="fouls-container">
        <div class="foul" id="local-fouls">0</div>
        <div class="foul" id="visitor-fouls">0</div>
    </div>
    <div class="tiempos-container">
        <div class="tiempos" id="tiempos-local">○○○</div>
        <div class="tiempos" id="tiempos-visitante">○○○</div>
    </div>
    <div class="teams-container">
        <div class="team" id="local-team">
            <h2>Yuncos</h2>
            <div class="score-container">
                <span class="score" id="local-score">0</span>
                <div class="score-buttons">
                    <button class="score-button" id="local-plus"><i class="fas fa-plus"></i></button>
                    <button class="score-button" id="local-minus"><i class="fas fa-minus"></i></button>
                </div>
            </div>
        </div>
        <img class="center-image" src="Adobe Express - file.png" alt="Imagen central" id="timer-control">
        <div class="team" id="visitor-team">
            <h2>Visitante</h2>
            <div class="score-container">
                <span class="score" id="visitor-score">0</span>
                <div class="score-buttons">
                    <button class="score-button" id="visitor-plus"><i class="fas fa-plus"></i></button>
                    <button class="score-button" id="visitor-minus"><i class="fas fa-minus"></i></button>
                </div>
            </div>
        </div>
    </div>
    <button class="fullscreen-button" id="fullscreen-btn">&#x26F6;</button>
    <button class="buzzer-button" id="play-buzzer-btn">
        <svg class="buzzer-icon" viewBox="0 0 24 24">
            <path d="M18 5h-4V3h-4v2H6l-2 4h16l-2-4z"/>
            <path d="M8 9h8v6H8z"/>
            <circle cx="12" cy="12" r="2"/>
        </svg>
    </button>
</div>

<div class="settings-modal">
    <div class="settings-content">
        <span class="close-btn">&times;</span>
        <h3>Configuración</h3>
        <label class="label-inline"> Mostrar hora real: <input type="checkbox" id="show-real-time"></label>
        <hr style="border-color: #444; margin: 1.5vh 0;">
        <label class="label-inline"> Minutos: <input type="number" id="minutes" min="0" max="99" value="10"></label>
        <label class="label-inline">Segundos: <input type="number" id="seconds" min="0" max="59" value="0"></label>
        <label class="label-inline">Décimas: <input type="number" id="decimals" min="0" max="9" value="0"></label>
        <label class="label-inline">Equipo local: <input type="text" id="local-team-name" value="Yuncos"></label>
        <label class="label-inline">Equipo visitante: <input type="text" id="visitor-team-name" value="Visitante"></label>
        <div style="margin-top: 2vh;">
            <button id="set-1-minute">1 M</button>
            <button id="set-5-minutes">5 M</button>
            <button id="set-10-minutes">10 M</button>
            <button id="set-20-minutes">20 M</button>
        </div>
        <button id="save-settings" style="width: 100%; margin-top: 2.5vh; background: #ffcc00; font-weight: bold;">Guardar</button>
    </div>
</div>

<audio id="buzzer" src="buzzer.mp3" preload="auto"></audio>

<script>
let totalMilliSeconds = 10 * 60 * 1000; 
let timerRunning = false, animationFrameId, realTimeInterval = null;
let startTime = 0, timeRemainingAtPause = totalMilliSeconds;
let showRealTimeMode = false;

let localScore = 0, visitorScore = 0;
let localFouls = 0, visitorFouls = 0;
let tiemposLocal = 0, tiemposVisitante = 0;
let quarter = 1;

// Variable para controlar que la bocina suene solo una vez cuando se agote el tiempo
let buzzerTriggered = false;

const localFoulsElemento = document.getElementById('local-fouls');
const visitorFoulsElemento = document.getElementById('visitor-fouls');
const tiemposLocalElemento = document.getElementById('tiempos-local');
const tiemposVisitanteElemento = document.getElementById('tiempos-visitante');
const fallbackBuzzer = document.getElementById('buzzer');

let audioCtx = null;
let audioBuffer = null;

function updateScores(){
    document.getElementById('local-score').textContent = localScore;
    document.getElementById('visitor-score').textContent = visitorScore;
}

function updateFouls(){
    localFoulsElemento.textContent = localFouls;
    visitorFoulsElemento.textContent = visitorFouls;
    localFoulsElemento.style.color = localFouls===4 ? 'yellow' : localFouls===5 ? 'red' : 'white';
    visitorFoulsElemento.style.color = visitorFouls===4 ? 'yellow' : visitorFouls===5 ? 'red' : 'white';
}

function actualizarTiempos(){
    tiemposLocalElemento.textContent='●'.repeat(tiemposLocal)+'○'.repeat(3-tiemposLocal);
    tiemposVisitanteElemento.textContent='●'.repeat(tiemposVisitante)+'○'.repeat(3-tiemposVisitante);
}

function manejarTiempos(equipo){
    if(equipo==='local') tiemposLocal=tiemposLocal<3? tiemposLocal+1 :0;
    else tiemposVisitante=tiemposVisitante<3? tiemposVisitante+1:0;
    actualizarTiempos();
}

function updateTimerDisplay(){
    if (showRealTimeMode) {
        let now = new Date();
        let hrs = now.getHours().toString().padStart(2, '0');
        let mins = now.getMinutes().toString().padStart(2, '0');
        document.getElementById('timer').textContent = `${hrs}:${mins}`;
        return;
    }

    let currentMs = Math.max(0, timerRunning ? timeRemainingAtPause - (performance.now() - startTime) : timeRemainingAtPause);
    
    let totalSeconds = Math.ceil(currentMs / 100);
    let min = Math.floor(totalSeconds / 600);
    let sec = Math.floor((totalSeconds % 600) / 10);
    let dec = Math.floor(totalSeconds % 10);

    let displaySeconds = sec < 10 && min === 0 ? `${sec}` : sec < 10 ? `0${sec}` : sec;
    let displayTime = min > 0 ? `${min}:${displaySeconds}` : `${displaySeconds}.${dec}`;
    
    document.getElementById('timer').textContent = displayTime;
    
    // RETARDO COMPENSADO: Se dispara 500 ms antes para compensar el HDMI inalámbrico
    let compensationMs = 500; 
    if (currentMs <= compensationMs && timerRunning && !buzzerTriggered) {
        buzzerTriggered = true;
        playBuzzer();
    }

    if (currentMs <= 0 && timerRunning) {
        timerRunning = false;
        timeRemainingAtPause = 0;
        document.getElementById('timer').textContent = "0.0";
    }
}

function runTimerLoop() {
    if (!timerRunning || showRealTimeMode) return;
    updateTimerDisplay();
    if (timeRemainingAtPause - (performance.now() - startTime) > 0) {
        animationFrameId = requestAnimationFrame(runTimerLoop);
    }
}

function syncInputsFromMilliSeconds() {
    let totalSeconds = Math.ceil(timeRemainingAtPause / 100);
    document.getElementById('minutes').value = Math.floor(totalSeconds / 600);
    document.getElementById('seconds').value = Math.floor((totalSeconds % 600) / 10);
    document.getElementById('decimals').value = Math.floor(totalSeconds % 10);
    document.getElementById('show-real-time').checked = showRealTimeMode;
}

function inicializarWebAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    fetch('buzzer.mp3')
        .then(response => response.arrayBuffer())
        .then(data => audioCtx.decodeAudioData(data))
        .then(buffer => { audioBuffer = buffer; })
        .catch(err => console.log("Web Audio fallback activo:", err));
}

function playBuzzer(){
    if (audioCtx && audioBuffer) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const bufferSource = audioCtx.createBufferSource();
        bufferSource.buffer = audioBuffer;
        bufferSource.connect(audioCtx.destination);
        bufferSource.start(0);
    } else {
        fallbackBuzzer.volume = 1.0;
        fallbackBuzzer.loop = false;
        fallbackBuzzer.currentTime = 0;
        fallbackBuzzer.play().catch(e => {});
    }
}

function desbloquearAudio() {
    inicializarWebAudio();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    fallbackBuzzer.play().then(() => {
        fallbackBuzzer.pause();
        fallbackBuzzer.currentTime = 0;
    }).catch(e => {});
    document.removeEventListener('touchstart', desbloquearAudio);
    document.removeEventListener('click', desbloquearAudio);
}

document.addEventListener('touchstart', desbloquearAudio);
document.addEventListener('click', desbloquearAudio);

function updateQuarter(){
    let text = "";
    if(quarter === 1) text = "1º Cuarto";
    else if(quarter === 2) text = "2º Cuarto";
    else if(quarter === 3) text = "Descanso";
    else if(quarter === 4) text = "3º Cuarto";
    else if(quarter === 5) text = "4º Cuarto";
    else text = "Prórroga";
    document.getElementById('quarter').textContent = text;
}

const timerControlImg = document.getElementById('timer-control');

timerControlImg.addEventListener('contextmenu', (e) => {
    e.preventDefault();
});

timerControlImg.addEventListener('click', ()=>{
    if (showRealTimeMode) return; 
    if (timeRemainingAtPause <= 0) return;
    
    timerRunning = !timerRunning;
    if(timerRunning) {
        startTime = performance.now();
        buzzerTriggered = false; // Reiniciamos el aviso al poner en marcha el reloj
        runTimerLoop();
    } else {
        cancelAnimationFrame(animationFrameId);
        timeRemainingAtPause -= (performance.now() - startTime);
        if (timeRemainingAtPause < 0) timeRemainingAtPause = 0;
        updateTimerDisplay();
    }
});

document.getElementById('fullscreen-btn').addEventListener('click', ()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen());
document.getElementById('play-buzzer-btn').addEventListener('click', playBuzzer);

document.getElementById('local-plus').addEventListener('click', ()=>{localScore=(localScore+1)%200; updateScores();});
document.getElementById('visitor-plus').addEventListener('click', ()=>{visitorScore=(visitorScore+1)%200; updateScores();});
document.getElementById('local-minus').addEventListener('click', ()=>{localScore=localScore>0? localScore-1:199; updateScores();});
document.getElementById('visitor-minus').addEventListener('click', ()=>{visitorScore=visitorScore>0? visitorScore-1:199; updateScores();});

document.getElementById('local-fouls').addEventListener('click', ()=>{localFouls=localFouls<5? localFouls+1:0; updateFouls();});
document.getElementById('visitor-fouls').addEventListener('click', ()=>{visitorFouls=visitorFouls<5? visitorFouls+1:0; updateFouls();});

document.getElementById('tiempos-local').addEventListener('click', ()=> manejarTiempos('local'));
document.getElementById('tiempos-visitante').addEventListener('click', ()=> manejarTiempos('visitante'));

document.getElementById('quarter').addEventListener('click', ()=>{quarter++; if(quarter>6) quarter=1; updateQuarter();});

document.getElementById('save-settings').addEventListener('click', ()=>{
    showRealTimeMode = document.getElementById('show-real-time').checked;
    
    if (showRealTimeMode) {
        if(timerRunning){ cancelAnimationFrame(animationFrameId); timerRunning=false; }
        updateTimerDisplay(); 
        if(!realTimeInterval) {
            realTimeInterval = setInterval(updateTimerDisplay, 1000);
        }
    } else {
        if(realTimeInterval) { clearInterval(realTimeInterval); realTimeInterval = null; }
        
        let m = parseInt(document.getElementById('minutes').value) || 0;
        let s = parseInt(document.getElementById('seconds').value) || 0;
        let d = parseInt(document.getElementById('decimals').value) || 0;
        
        if(timerRunning){ cancelAnimationFrame(animationFrameId); timerRunning=false; }
        timeRemainingAtPause = ((m * 60) + s) * 1000 + (d * 100);
        buzzerTriggered = false;
    }
    
    document.getElementById('local-team').querySelector('h2').textContent = document.getElementById('local-team-name').value;
    document.getElementById('visitor-team').querySelector('h2').textContent = document.getElementById('visitor-team-name').value;
    
    updateTimerDisplay(); closeSettingsModal();
});

document.getElementById('set-1-minute').addEventListener('click', ()=>{ document.getElementById('minutes').value=1; document.getElementById('seconds').value=0; document.getElementById('decimals').value=0; buzzerTriggered = false; });
document.getElementById('set-5-minutes').addEventListener('click', ()=>{ document.getElementById('minutes').value=5; document.getElementById('seconds').value=0; document.getElementById('decimals').value=0; buzzerTriggered = false; });
document.getElementById('set-10-minutes').addEventListener('click', ()=>{ document.getElementById('minutes').value=10; document.getElementById('seconds').value=0; document.getElementById('decimals').value=0; buzzerTriggered = false; });
document.getElementById('set-20-minutes').addEventListener('click', ()=>{ document.getElementById('minutes').value=20; document.getElementById('seconds').value=0; document.getElementById('decimals').value=0; buzzerTriggered = false; });

document.querySelector('.settings-button').addEventListener('click', ()=>{ syncInputsFromMilliSeconds(); document.querySelector('.settings-modal').style.display='flex'; });
document.querySelector('.close-btn').addEventListener('click', closeSettingsModal);
function closeSettingsModal(){document.querySelector('.settings-modal').style.display='none';}

updateScores(); updateFouls(); actualizarTiempos(); updateTimerDisplay(); updateQuarter();
</script>
</body>
</html>
